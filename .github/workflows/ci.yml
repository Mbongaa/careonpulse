name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAREON_ASSISTANT_LIVE: "0"
      CAREON_SCRIBE_LIVE: "0"
    services:
      postgres:
        image: postgres:15.19
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # SQL parity cases execute the production TypeScript source via ts-node.
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Retained-token authorization and transactional release gates
        run: |
          python3 src/scripts/verify-auth-postgres.py --port 5432 --user postgres
          python3 src/scripts/verify-facturatie-postgres.py --port 5432 --user postgres
          python3 src/scripts/verify-epd-postgres.py --port 5432 --user postgres
          python3 src/scripts/verify-scribe-postgres.py --port 5432 --user postgres

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAREON_ASSISTANT_LIVE: "0"
      CAREON_SCRIBE_LIVE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
      - run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > careon-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careon-sbom
          path: careon-sbom.cdx.json
          retention-days: 30

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAREON_ASSISTANT_LIVE: "0"
      CAREON_SCRIBE_LIVE: "0"
      CAREON_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
